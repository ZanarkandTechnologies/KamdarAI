name: kamdar-hermes

services:
  gateway:
    image: nousresearch/hermes-agent:latest@sha256:8cc6e4aea47e0b7362f2da655cc81a1f1120fbdcdcae087850dabb6d7adee964
    restart: unless-stopped
    volumes:
      - kamdar_hermes_data:/opt/data
    environment:
      HERMES_HOME: /opt/data
      HERMES_UID: "10000"
      HERMES_GID: "10000"
    command: ["hermes", "-p", "kamdar-ai", "gateway", "run"]
    networks: [runtime]

  dashboard:
    image: nousresearch/hermes-agent:latest@sha256:8cc6e4aea47e0b7362f2da655cc81a1f1120fbdcdcae087850dabb6d7adee964
    restart: unless-stopped
    depends_on: [gateway]
    volumes:
      - kamdar_hermes_data:/opt/data
    environment:
      HERMES_HOME: /opt/data/profiles/kamdar-ai
      HERMES_UID: "10000"
      HERMES_GID: "10000"
    ports:
      - "127.0.0.1:9119:9119"
    command: ["python", "/opt/data/profiles/kamdar-ai/scripts/dashboard_bridge.py"]
    networks: [runtime]

  setup:
    image: nousresearch/hermes-agent:latest@sha256:8cc6e4aea47e0b7362f2da655cc81a1f1120fbdcdcae087850dabb6d7adee964
    profiles: [setup]
    stdin_open: true
    tty: true
    volumes:
      - kamdar_hermes_data:/opt/data
      - .:/distribution:ro
    environment:
      HERMES_HOME: /opt/data
      KAMDAR_PROFILE_HOME: /opt/data/profiles/kamdar-ai
      KAMDAR_GATEWAY_ORIGIN: http://gateway:8645
      KAMDAR_TUNNEL_METRICS: http://cloudflared:2000
      HERMES_UID: "10000"
      HERMES_GID: "10000"
    working_dir: /distribution
    command: ["python", "/distribution/setup.py"]
    networks: [runtime]

  cloudflared:
    image: cloudflare/cloudflared:2026.8.0
    profiles: [webhook]
    restart: unless-stopped
    depends_on: [gateway]
    volumes:
      - kamdar_hermes_data:/opt/data:ro
    environment:
      TUNNEL_TOKEN_FILE: /opt/data/profiles/kamdar-ai/secrets/cloudflare-tunnel-token
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
    networks: [runtime]

volumes:
  kamdar_hermes_data:
    name: kamdar-hermes-data

networks:
  runtime:
    internal: false
