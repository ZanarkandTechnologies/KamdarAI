name: kamdar-ai
version: 1.7.0
description: "Kamdar Company OS workspace, provider catalog, automations, onboarding, and connectors"
hermes_requires: ">=0.20.4"
author: "Zanarkand Technologies"

# Secrets and model configuration are client-owned. These integrations are
# optional until their dedicated onboarding flow is invoked.
env_requires:
  - name: NOTION_TOKEN
    description: "Notion integration token for Company OS data access"
    required: false

# This is the client installation boundary. The repository remains a complete
# development/evaluation harness, while Hermes copies only these runtime files.
distribution_owned:
  - distribution.yaml
  - setup.py
  - setup.cmd
  - compose.yaml
  - scripts/setup_runtime.py
  - scripts/setup_cli
  - scripts/setup_workspace.py
  - scripts/setup_profile.py
  - scripts/provider_catalog.py
  - scripts/composio_session.py
  - scripts/run_connection_evals.py
  - scripts/run_installed_evals.py
  - catalog/data-sources
  - evals/daily
  - evals/weekly
  - evals/meeting-intake
  - workspace.hermes.template.md
  - automations
  - schemas/automations
  - evals/rubrics/end-user-artifact-quality.md
  - templates
  - plugins/platforms/notion/__init__.py
  - plugins/platforms/notion/adapter.py
  - plugins/platforms/notion/api.py
  - plugins/platforms/notion/cli.py
  - plugins/platforms/notion/plugin.yaml
  - plugins/platforms/notion/protocol.py
